name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.5"
          python-version: "3.11.17"
      - run: uv sync --frozen
      - name: Run tests with coverage
        id: python-tests
        if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: uv run --frozen pytest ${{ github.ref == 'refs/heads/main' && '--cov=src --cov-report=term-missing --cov-report=xml' || '' }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        # Main keeps packaging, but does not repeat the PR suite or regenerate coverage.
        if: steps.python-tests.outcome == 'success' && github.ref == 'refs/heads/main'
        with:
          files: python/coverage.xml
          fail_ci_if_error: false

  test-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers=2
        if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

  build-python:
    needs: test-python
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.5"
          python-version: "3.11.17"
      - run: uv lock --check
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  build-typescript:
    needs: test-typescript
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-dist
          path: |
            typescript/dist/
            typescript/package.json
            typescript/README.md
            typescript/LICENSE

  publish-python:
    needs: build-python
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        id: oidc
        with:
          # npm and PyPI versions are independent: a tag cut for one package
          # must not fail because the other's current version already exists.
          skip-existing: true
      - name: Publish to PyPI (Token fallback)
        if: steps.oidc.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

  publish-typescript:
    needs: build-typescript
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      - name: Check whether this version is already on npm
        id: exists
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "mcp-server-bitbucket@${VERSION}" version >/dev/null 2>&1; then
            echo "mcp-server-bitbucket@${VERSION} already published; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (Trusted Publishing)
        if: steps.exists.outputs.published == 'false'
        id: oidc
        continue-on-error: true
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ''
      - name: Publish to npm (Token fallback)
        if: steps.exists.outputs.published == 'false' && steps.oidc.outcome == 'failure'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-docker:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      matrix:
        implementation: [python, typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Build local source image without publishing
        run: docker build -t mcp-local -f ${{ matrix.implementation }}/Dockerfile ${{ matrix.implementation }}
      - name: Verify Python local distribution
        if: matrix.implementation == 'python'
        run: docker run --rm --entrypoint /app/.venv/bin/python mcp-local -c "import importlib.metadata; d = importlib.metadata.distribution('mcp-server-bitbucket'); import json; assert json.loads(d.read_text('direct_url.json'))['url'] == 'file:///app'; print(d.version, importlib.metadata.version('mcp'))"
      - name: Verify Node runtime
        if: matrix.implementation == 'typescript'
        run: docker run --rm --entrypoint node mcp-local -e "if (process.versions.node !== '24.22.1') process.exit(1); console.log(process.versions.node)"
