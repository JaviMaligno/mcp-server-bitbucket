name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          files: python/coverage.xml
          fail_ci_if_error: false

  test-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: npm test
        continue-on-error: true  # Tests are optional for now

  build-python:
    needs: test-python
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  build-typescript:
    needs: test-typescript
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-dist
          path: |
            typescript/dist/
            typescript/package.json
            typescript/README.md
            typescript/LICENSE

  publish-python:
    needs: build-python
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        id: oidc
      - name: Publish to PyPI (Token fallback)
        if: steps.oidc.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  publish-typescript:
    needs: build-typescript
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-azure:
    needs: build-typescript
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: azure-production
    permissions:
      id-token: write
      contents: read
    env:
      ACR_NAME: 9e204a1888514b6594409a4f437321f1
      ACA_NAME: bitbucket-mcp-server
      ACA_RG: datascience
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build & push image to ACR
        working-directory: typescript
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "bitbucket-mcp:${{ steps.ver.outputs.version }}" \
            --image bitbucket-mcp:latest \
            --file Dockerfile .
      - name: Update Container App
        run: |
          az containerapp update \
            --name "$ACA_NAME" \
            --resource-group "$ACA_RG" \
            --image "${ACR_NAME}.azurecr.io/bitbucket-mcp:${{ steps.ver.outputs.version }}"
      - name: Verify deployment
        run: |
          FQDN=$(az containerapp show --name "$ACA_NAME" --resource-group "$ACA_RG" --query "properties.configuration.ingress.fqdn" -o tsv)
          for i in 1 2 3 4 5 6; do
            VERSION=$(curl -fsS -m 10 "https://${FQDN}/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            echo "Attempt $i: version=$VERSION"
            if [ "$VERSION" = "${{ steps.ver.outputs.version }}" ]; then
              echo "Deploy verified."
              exit 0
            fi
            sleep 10
          done
          echo "Deployed version did not match within timeout" >&2
          exit 1
