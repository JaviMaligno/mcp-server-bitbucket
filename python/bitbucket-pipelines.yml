image: python:3.12.15

definitions:
  caches:
    uv: ~/.cache/uv

pipelines:
  default:
    - step:
        name: Lint & Test
        caches:
          - uv
        script:
          - cd python
          - sh scripts/bootstrap-uv.sh
          - uv sync --frozen --dev
          - uv run --frozen pytest -v --cov=src --cov-report=term-missing

  pull-requests:
    '**':
      - step:
          name: Lint & Test
          caches:
            - uv
          script:
            - cd python
            - sh scripts/bootstrap-uv.sh
            - uv sync --frozen --dev
            - uv run --frozen pytest -v --cov=src --cov-report=term-missing

  branches:
    main:
      - step:
          name: Test
          caches:
            - uv
          script:
            - cd python
            - sh scripts/bootstrap-uv.sh
            - uv sync --frozen --dev
            - uv run --frozen pytest -v --cov=src --cov-report=term-missing
      - step:
          name: Build Package
          caches:
            - uv
          script:
            - cd python
            - sh scripts/bootstrap-uv.sh
            - uv lock --check
            - uv build
          artifacts:
            - python/dist/**

  tags:
    v*:
      - step:
          name: Test
          caches:
            - uv
          script:
            - cd python
            - sh scripts/bootstrap-uv.sh
            - uv sync --frozen --dev
            - uv run --frozen pytest -v
      - step:
          name: Build & Publish to PyPI
          caches:
            - uv
          deployment: production
          script:
            - cd python
            - sh scripts/bootstrap-uv.sh
            - uv lock --check
            - uv build
            - uv publish --token $PYPI_TOKEN
