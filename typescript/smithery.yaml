# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
# This file configures how the MCP server is deployed and run on Smithery
# TypeScript version - located in typescript/ directory

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      BITBUCKET_WORKSPACE:
        type: string
        description: Bitbucket workspace slug (e.g., 'my-team')
      BITBUCKET_EMAIL:
        type: string
        description: Account email for Bitbucket Basic Auth (required for basic auth)
      BITBUCKET_API_TOKEN:
        type: string
        description: Atlassian API token used with Basic auth
      BITBUCKET_OAUTH_TOKEN:
        type: string
        description: Workspace/project/repository access token sent as `Authorization: Bearer`
      BITBUCKET_AUTH_TYPE:
        type: string
        description: Force auth mode - `basic` or `bearer` (auto-detected when unset)
      API_TIMEOUT:
        type: number
        default: 30
        description: Request timeout in seconds (max 300)
      MAX_RETRIES:
        type: number
        default: 3
        description: Max retry attempts for rate limiting (max 10)
    required:
      - BITBUCKET_WORKSPACE
  commandFunction: |
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        BITBUCKET_WORKSPACE: config.BITBUCKET_WORKSPACE,
        BITBUCKET_EMAIL: config.BITBUCKET_EMAIL,
        BITBUCKET_API_TOKEN: config.BITBUCKET_API_TOKEN,
        BITBUCKET_OAUTH_TOKEN: config.BITBUCKET_OAUTH_TOKEN,
        BITBUCKET_AUTH_TYPE: config.BITBUCKET_AUTH_TYPE,
        API_TIMEOUT: config.API_TIMEOUT ? String(config.API_TIMEOUT) : "30",
        MAX_RETRIES: config.MAX_RETRIES ? String(config.MAX_RETRIES) : "3"
      }
    })
  exampleConfig:
    BITBUCKET_WORKSPACE: my-workspace
    BITBUCKET_EMAIL: user@example.com
    BITBUCKET_API_TOKEN: your-api-token

